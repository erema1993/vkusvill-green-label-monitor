name: Monitor green labels

on:
  schedule:
    # Каждые 10 минут, со сдвигом от перегруженного начала часа.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram test message only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vkusvill-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Restore previous product IDs
        if: ${{ inputs.send_test != true }}
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: vv-state-${{ github.run_id }}
          restore-keys: |
            vv-state-

      - name: Check VkusVill
        if: ${{ inputs.send_test != true }}
        env:
          VV_COOKIE: ${{ secrets.VV_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_HASH_KEY: ${{ secrets.STATE_HASH_KEY }}
        run: python3 monitor.py

      - name: Send Telegram test
        if: ${{ inputs.send_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py --send-test

      - name: Save current product IDs
        if: ${{ success() && inputs.send_test != true }}
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: vv-state-${{ github.run_id }}
